<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthKeeper</title>
  <meta name="description" content="AuthKeeper — OAuth token management for Google services.">
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e6e8eb;
      --muted: #9aa0a6;
      --accent: #4f8cff;
      --border: #2a2e37;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container { max-width: 640px; text-align: center; }
    h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; }
    p.sub { color: var(--muted); margin-top: 0.75rem; font-size: 1.05rem; }
    .links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      min-width: 200px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
    .card p { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; }
    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.7rem; }
      .card { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AuthKeeper</h1>
    <p class="sub">OAuth token management for Google services</p>

    <div class="links">
      <a class="card" href="/privacy">
        <h2>Privacy Policy</h2>
        <p>How we handle your data</p>
      </a>
      <a class="card" href="/terms">
        <h2>Terms of Service</h2>
        <p>Rules for using the app</p>
      </a>
    </div>

    <footer>
      <p>© 2026 AuthKeeper. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
